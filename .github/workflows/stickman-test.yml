name: Render 15s Stickman Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/render_stickman.py'
      - '.github/workflows/stickman-test.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate 15s MP4
        run: python tests/render_stickman.py
      - name: Validate output
        run: |
          test -s out/stickman-15s-test.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/stickman-15s-test.mp4
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stickman-15s-video
          path: out/stickman-15s-test.mp4
